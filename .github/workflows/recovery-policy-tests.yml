name: P0 recovery policy host tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Compile and run anchor-eligibility regression tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I patch_src/exlaunch/source tests/recovery_policy_test.cpp -o /tmp/ocoop-recovery-policy-test
          /tmp/ocoop-recovery-policy-test
