# Odyssey Local Co-op release settings
#
# This LayeredFS file is read at every StageScene initialization. Edit the
# installed copy while Ryujinx is closed, or enter a different stage after an
# edit to reload it. The mod never writes this file.

# Standard co-op zoom at zero/near separation. 1.00 = Odyssey's native camera.
camera.zoom.base=1.12

# Dynamic zoom ceiling reached at camera.zoom.separation_full.
camera.zoom.max=1.85

# P1/P2 separation thresholds. Height contributes less than horizontal distance.
camera.zoom.separation_start=350
camera.zoom.separation_full=2100

# Per-frame smoothing. Zooming out uses twice this rate. Valid range: 0.001 through 1.0.
camera.zoom.lerp=0.05

# P2 costume archive names present in Odyssey 1.0.0. Empty values inherit P1.
player.p2.body=MarioColorLuigi
player.p2.cap=MarioColorLuigi

# Delay after a player's native death animation before recovery-bubble return.
respawn.delay_seconds=10

# Separation recovery distance, grace period, and per-player cooldown.
bubble.distance=3000
bubble.hold_seconds=1.1
bubble.cooldown_seconds=5

# Treat a captured actor that is currently in water as a safe recovery
# destination, equivalent to standing on ground. Set to 0 to require ground.
bubble.water_counts_as_ground=1

# Developer-only, experimental in-game P0 Test Lab. Disabled by default.
# When enabled, the map (-) button toggles the lab, D-pad Up cycles presets,
# A arms/confirms, and P1 must be present. USE ONLY ON BACKED-UP TEST SAVES.
# The initial lab records and replays safe positions within the CURRENT stage;
# it does not warp to kingdoms or reset story flags.
debug.menu.enabled=0
# EXPERIMENTAL: enable only on a separate disposable save/profile.
# Native reload can trigger the game's normal save behavior.
debug.native_reload.enabled=0
# Test Lab position relative to the original scoreboard anchor.
# Increase X to move right. Adjust Y only if needed.
debug.menu.hud_x=560
debug.menu.hud_y=0

# Optional scoreboard-only competitions. The HUD archive is included in the
# release, so either mode can be enabled without preparing any extra assets.
# They remain off by default because some scoring paths are still incomplete.
competition.coin.enabled=0
competition.coin.target=10
competition.moon.enabled=0
competition.moon.target=3

# Reserved scoreboard offset settings.
competition.hud_x=0
competition.hud_y=0
